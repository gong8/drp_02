name: dev check

# A fast gate on `dev` - the default working branch (per CONTRIBUTING/CLAUDE.md) AND the branch
# deploy-api-dev.yml auto-ships to the live dev backend. Previously dev had NO gate, so a
# broken-but-compiling change could reach a running backend with the first signal being a rollback
# warning. This runs lint + typecheck + tests (against a throwaway Postgres) on every push/PR to dev
# so that class of breakage is caught before it deploys. The full `pnpm check` (which also runs the
# quality/escape-hatch gate) still runs on the dev -> main PR via node.js.yml.

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The API integration tests need a real Postgres; map it to host 5433 so the test harness
    # defaults (localhost:5433, drp/drp/drp) work with no extra env.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drp
          POSTGRES_PASSWORD: drp
          POSTGRES_DB: drp
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Use Node.js 20.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
