<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover - or be square</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#c9c4bd;}</style>
</head>
<body>
<section class="slide slide--blush" style="width:1920px;height:1080px;padding:80px 110px;position:relative;overflow:hidden;">

  <!-- top bar -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div style="font-family:Inter;font-weight:700;font-size:23px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);">Designing for Real People</div>
    <div style="font-family:'Space Mono',monospace;font-weight:700;font-size:22px;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px 15px;">DRP &middot; GROUP 02</div>
  </div>

  <!-- the pun: be there [BeThere] ... or be square [a literal square] -->
  <div style="margin-top:auto;margin-bottom:auto;">
    <h1 style="font-family:Archivo;font-weight:900;font-size:212px;letter-spacing:-9px;line-height:.84;margin:0;color:var(--ink);">Be<span style="color:var(--pink);">There</span></h1>
    <div style="display:flex;align-items:center;gap:30px;margin-top:30px;">
      <span style="font-family:Archivo;font-weight:800;font-size:94px;letter-spacing:-2px;color:var(--ink);">or be</span>
      <span style="display:inline-flex;align-items:center;justify-content:center;width:150px;height:150px;border:5px solid var(--ink);border-radius:5px;background:var(--surface);box-shadow:11px 11px 0 var(--grey);font-family:Archivo;font-weight:800;font-size:30px;color:var(--muted);letter-spacing:.5px;">square</span>
    </div>
    <p style="font-family:Inter;font-weight:600;font-size:31px;color:var(--muted);margin:40px 0 0;">No organiser. No maybe. Just the whole group, there.</p>
  </div>

  <!-- bottom -->
  <div style="display:flex;justify-content:flex-end;align-items:flex-end;">
    <div style="font-family:Inter;font-weight:700;font-size:24px;color:var(--ink);">Nelson &middot; Lukas &middot; Noah &middot; James</div>
  </div>

</section>
</body>
</html>
