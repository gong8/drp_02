<section class="slide slide--blush" style="width:1920px;height:1080px;padding:80px 110px;position:relative;overflow:hidden;">

  <!-- top bar -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div style="font-family:Inter;font-weight:700;font-size:23px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);">Designing for Real People</div>

  </div>

  <!-- hero: the hidden "Be There" surfaced -->
  <div style="margin-top:auto;margin-bottom:auto;">
    <div style="display:flex;align-items:baseline;gap:6px;">
      <span style="font-family:Archivo;font-weight:900;font-size:246px;letter-spacing:-10px;line-height:.9;color:var(--ink);">Be</span>
      <span style="font-family:Archivo;font-weight:900;font-size:206px;letter-spacing:-6px;line-height:.9;color:var(--surface);background:var(--pink);border:6px solid var(--ink);box-shadow:16px 16px 0 var(--ink);border-radius:20px;padding:6px 34px 26px;">There</span>

    <p style="font-family:Archivo;font-weight:800;font-size:60px;letter-spacing:-1.5px;color:var(--ink);margin:56px 0 0;">No organiser. No maybe.</p>
  </div>

  <!-- bottom -->
  <div style="display:flex;justify-content:space-between;align-items:flex-end;">
    <div style="font-family:Inter;font-weight:500;font-size:27px;color:var(--muted);">Turning &ldquo;we should hang out&rdquo; into a firm plan.</div>
    <div style="font-family:Inter;font-weight:700;font-size:24px;color:var(--ink);">Nelson &middot; Lukas &middot; Noah &middot; James</div>
  </div>

</section>
