<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover - Stacked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#c9c4bd;}</style>
</head>
<body>
<section class="slide slide--blush" style="width:1920px;height:1080px;padding:80px 110px;position:relative;overflow:hidden;">

  <!-- top bar -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div style="font-family:Inter;font-weight:700;font-size:23px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);">Designing for Real People</div>
    <div style="font-family:'Space Mono',monospace;font-weight:700;font-size:22px;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px 15px;">DRP &middot; GROUP 02</div>
  </div>

  <!-- monumental stack -->
  <div style="margin-top:auto;margin-bottom:auto;display:flex;align-items:flex-end;gap:64px;">
    <h1 style="font-family:Archivo;font-weight:900;font-size:300px;letter-spacing:-12px;line-height:.78;margin:0;">
      <span style="display:block;color:var(--ink);">Be</span>
      <span style="display:block;color:var(--pink);-webkit-text-stroke:5px var(--ink);">There</span>
    </h1>
    <div style="padding-bottom:30px;max-width:560px;">
      <p style="font-family:Archivo;font-weight:800;font-size:62px;letter-spacing:-1.5px;line-height:1.0;color:var(--ink);margin:0;">No organiser.<br>No <span class="hl" style="padding:0 16px 6px;">maybe</span>.</p>
      <p style="font-family:Inter;font-weight:500;font-size:26px;line-height:1.4;color:var(--muted);margin:28px 0 0;">One plan to the whole group. Everyone decides together - anonymously.</p>
    </div>
  </div>

  <!-- bottom -->
  <div style="display:flex;justify-content:flex-end;align-items:flex-end;">
    <div style="font-family:Inter;font-weight:700;font-size:24px;color:var(--ink);">Nelson &middot; Lukas &middot; Noah &middot; James</div>
  </div>

</section>
</body>
</html>
