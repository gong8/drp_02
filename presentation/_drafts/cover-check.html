<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover - RSVP check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#c9c4bd;}</style>
</head>
<body>
<section class="slide slide--blush" style="width:1920px;height:1080px;padding:80px 110px;position:relative;overflow:hidden;">

  <!-- top bar -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;">
    <div style="font-family:Inter;font-weight:700;font-size:23px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);">Designing for Real People</div>
    <div style="font-family:'Space Mono',monospace;font-weight:700;font-size:22px;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:8px 15px;">DRP &middot; GROUP 02</div>
  </div>

  <!-- hero: the name as an RSVP that resolves -->
  <div style="margin-top:auto;margin-bottom:auto;">
    <div style="display:flex;align-items:center;gap:40px;">
      <span style="flex-shrink:0;width:158px;height:158px;border:6px solid var(--ink);border-radius:30px;background:var(--green);box-shadow:13px 13px 0 var(--ink);display:flex;align-items:center;justify-content:center;color:var(--surface);font-family:Archivo;font-weight:900;font-size:104px;line-height:1;">&#10003;</span>
      <h1 style="font-family:Archivo;font-weight:900;font-size:228px;letter-spacing:-10px;line-height:.86;color:var(--ink);margin:0;">BeThere</h1>
    </div>
    <p style="font-family:Archivo;font-weight:800;font-size:58px;letter-spacing:-1.5px;color:var(--ink);margin:50px 0 0;">No organiser. No <span class="hl" style="padding:0 18px 6px;">maybe</span>.</p>
  </div>

  <!-- bottom -->
  <div style="display:flex;justify-content:space-between;align-items:flex-end;">
    <div style="font-family:Inter;font-weight:500;font-size:27px;color:var(--muted);">The plan the whole group actually shows up to.</div>
    <div style="font-family:Inter;font-weight:700;font-size:24px;color:var(--ink);">Nelson &middot; Lukas &middot; Noah &middot; James</div>
  </div>

</section>
</body>
</html>
